name: Release CytoCount

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies & Build Sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend
          python -m PyInstaller --noconfirm viacell-backend.spec
          cd ..
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          Copy-Item backend/dist/viacell-backend.exe src-tauri/binaries/viacell-backend-x86_64-pc-windows-msvc.exe -Force

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Desktop App and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: __VERSION__
          releaseName: 'CytoCount v__VERSION__'
          releaseBody: 'Consulte os detalhes e melhorias da versão no changelog do projeto.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
